[abbreviations_ignore]
# Upper-case fragments that are not abbreviations (maths symbols, part of a formula), or whose expansion
# the public sources do not give (left visible as warnings instead of guessed).
tokens = ["AA", "CXX", "TOLPL", "TWO", "LL", "MOONPA", "MOONPADE440", "EPM2021", "RE", "DELTA", "STAR", "EPH", "KP16", "KRAC", "LU22", "APOL"]
# RE: the Earth radius symbol in a formula; DELTA, STAR: Walker pattern keywords; EPH, KP16, KRAC,
# LU22, APOL: RINEX-4-style record names, quoted as written.

[site_tokens]
# Identifiers the site may print that are neither features nor found in the engine repository.
# (2026-09-30: the scenario files of the campaign, constellation-design, spectrum, body-pnt and solar-system
# kinds that used to be listed here are register rows now; the site and the register read one engine checkout.)
# Docs (2026-09-30): file names a reader types in shell examples (`> campaign.toml`, `> s.toml`) and a
# signal data file (data/leo-signals/generic-c-band.toml), none of them scenarios.
# 0.33.0: `--data` is an option of `kshana iq scene` (src/iq_cli.rs); the register holds the iq
# subcommand as one row (cli:iq) and does not enumerate its options, and the changelog page now names it.
# 0.35.0: `session`, `events` and `bench-session` are the file names the receiver-trust, test-bench and
# telemetry docs type in shell examples (`session.toml`, `events.toml`, `bench-session.toml`), not scenarios;
# `static` and `vessel` are values of `[platform] kind` in a receiver-trust session file, not scenario kinds;
# the four are the nmea-scenario library (scenarios/training/*.toml, run by `kshana nmea-scenario`, not
# `kshana <scenario.toml>`), listed in docs/NMEA-TRAINING.md.
ignore = ["request", "campaign", "s", "generic-c-band", "--data", "session", "events", "bench-session", "static", "vessel", "open-sea-jamming", "coastal-drag-off", "port-approach-time-spoof", "combined-event", "fjord-natural-degradation", "lab", "holdover-test"]
# 0.38: `lab.toml` (docs/EVIDENCE-PACKS.md, the --lab-attestation file) and `holdover-test.toml` (docs/TIMING-HIL.md, a shell example) are file names a reader types, not registered scenarios.

