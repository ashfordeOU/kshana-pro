# Kshana site placements for the feature register (hand-edited).
#
# One entry per feature id in features.json. A feature with no entry is UNPLACED: the checker
# fails, nothing is defaulted. Fields:
#   page     Home | Missions | Capabilities | Evidence | Developers | Editions | Docs | Studio
#   section  the element id on that page that must show the feature (Docs: '<file>.html#<anchor>';
#            Studio: an element id in the Studio index.html)
#   studio   the Studio scenario id that runs it, '#<element-id>' for a Studio control, or 'none'
#   docs     'docs/<file>.html#<anchor>' in the built docs, or 'none'
#   also     optional secondary 'Page#section' placements (reported, not failed)
#   pro_link optional Pro/Study row id when Pro or a study adds something to this capability
#   description / note  optional overrides

