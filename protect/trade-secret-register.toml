# PRIVATE: trade-secret register and patent-before-disclosure rule (roadmap 0.42 X7).
# Never copy this file, or any line of it, to a public place. The checks print item IDs
# and term IDs (first 12 hex characters of the SHA-256 of a term), never a term.
#
# One [[item]] per secret method or invention. Fields:
#   id           short public-safe ID (the roadmap's P1..P5, B6); never a method name
#   status       secret   : a trade secret, never disclosed (no filing planned)
#                to-file  : patent filing planned; nothing may be disclosed yet
#                filed    : filed on filing_date; disclosure allowed from that date
#                public   : disclosed on purpose (after filing, or released by the owner)
#   filing_date  YYYY-MM-DD, required for filed; the earliest day disclosure is allowed
#   owner        who decides (founder; counsel for filings)
#   recorded     YYYY-MM-DD the line was added or last changed
#   term_ids     IDs of terms in protect/private-terms.txt that disclose the item
#   terms        further disclosure terms kept only here (fixed strings, case-sensitive)
#
# scripts/protect/arksa-copy-check.py runs this check on every scope (kpro, open, site):
# any term of an item that is secret, to-file, or filed with a filing date still ahead,
# found in a published file, fails the check. Owner and counsel add each item's method
# terms when they write the filing; until then the Core names stand in.

format = "kshana-pro-trade-secret-register/1"

[[item]]
id = "P1"
status = "to-file"
owner = "founder; counsel files"
recorded = "2026-11-15"
term_ids = ["375d2cfc2c4e", "36ef4a4a07e5"]
terms = []

