# DERIVED by scratch/actlocal/derive.py; do not edit
name: pages
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Resolve the release tag to deploy
      id: t
      env:
        IN: ${{ inputs.tag }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\nif [ \"$GITHUB_REF\" != \"refs/heads/main\" ]; then\n  echo \"::error::dispatch this workflow on main (the github-pages environment deploys only from main); the tag input picks the content\"\n  exit 1\nfi\ntag=\"$IN\"\nif [ -z \"$tag\" ]; then\n  tag=\"$(gh release view --repo \"$REPO\" --json tagName --jq .tagName)\"\nfi\nif ! printf '%s' \"$tag\" | grep -qE '^v[0-9]+\\.[0-9]+\\.[0-9]+$'; then\n  echo \"::error::'$tag' is not a release tag of the form vX.Y.Z\"\n  exit 1\nfi\necho \"tag=$tag\" >> \"$GITHUB_OUTPUT\"\necho \"Deploying kshana.dev from $tag\"\n"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: The tag and the manifest agree
      env:
        TAG: ${{ steps.t.outputs.tag }}
      run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$TAG" ./scripts/check-version-sync.sh
    - name: Install Rust (with wasm target)
      uses: dtolnay/rust-toolchain@1.93.0
      with:
        targets: wasm32-unknown-unknown
    - name: Toolchain pin guard
      run: ./scripts/check-toolchain.sh
    - name: Install wasm-pack (pinned)
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
      with:
        tool: wasm-pack@0.13.1
    - name: Build the WebAssembly engine and stage it for the Studio
      run: ./web/build.sh
    - name: Stage the deploy tree
      run: "set -euo pipefail\nrsync -a --delete \\\n  --exclude '*.test.mjs' \\\n  --exclude 'smoke.mjs' \\\n  --exclude 'build.sh' \\\n  --exclude '/README.md' \\\n  --exclude '/tools/' \\\n  --exclude '/PORT-MANIFEST.json' \\\n  web/ site/\necho \"staged $(find site -type f | wc -l | tr -d ' ') of $(find web -type f | wc -l | tr -d ' ') file(s)\"\n# The deploy is useless without these: fail here, not on a blank page.\nfor f in index.html studio/index.html studio/pkg/kshana.js studio/pkg/kshana_bg.wasm playground/index.html \\\n         pkg/kshana.js docs/index.html 404.html CNAME robots.txt sitemap.xml llms.txt og-card.png legacy-redirects.js \\\n         fonts/FONTS.json vendor/VENDOR.json; do\n  [ -f \"site/$f\" ] || { echo \"::error::the staged site is missing $f\"; exit 1; }\ndone\n"
    - name: (local) keep the staged site as a run artefact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pages-site
        path: site
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v0.27.3. Blank = the latest published release.
        required: false
        type: string
