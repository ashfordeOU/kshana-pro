# %ProgramData%\kshana-pro\serve.conf: settings of the Kshana Pro Windows service.
# Installed by the MSI and kept on upgrade and on uninstall. Relative paths are taken
# from this file's folder. Restart the service after a change:
#   Restart-Service kshana-pro
# Local-only by default. To serve the network, set an address and add TLS and keys, e.g.
#   KSHANA_PRO_ADDR=0.0.0.0:8443
#   KSHANA_PRO_SERVE_ARGS=--workers 2 --tls-cert "C:\ProgramData\kshana-pro\chain.pem" --tls-key "C:\ProgramData\kshana-pro\key.pem" --keys-file "C:\ProgramData\kshana-pro\keys.toml"
KSHANA_PRO_ADDR=127.0.0.1:8088
KSHANA_PRO_DATA_DIR=data
KSHANA_PRO_HOME=licence
KSHANA_PRO_SERVE_ARGS=--workers 2
