# Kshana Pro — sovereign / air-gapped deployment.
#
# Hardened for an environment with NO outbound network. The Kshana engine and the
# Pro overlay perform no telemetry and no external calls, so the service runs fully
# offline. This compose enforces that posture and locks the container down.
#
#   docker compose -f kshana-pro/deploy/docker-compose.sovereign.yml up --build
#
# Air-gapped note: build the image on a connected machine, `docker save` it, and
# load it inside the enclave — no registry pulls at run time.
services:
  kshana-pro:
    build:
      context: ../..
      dockerfile: kshana-pro/Dockerfile
      args:
        # Licence PUBLIC key, compiled into the binary. The signing key never
        # goes into a build or a container.
        KSHANA_PRO_LICENSE_PUBKEY: "${KSHANA_PRO_LICENSE_PUBKEY:-}"
    image: kshana-pro:latest
    container_name: kshana-pro-sovereign
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088" # bind to loopback by default; front with your own gateway
    # The job service's data directory (job store, artefacts, delivery ledger) on a
    # named volume: the root file system stays read-only. Back the volume up.
    command: ["serve","--addr","0.0.0.0:8088","--data-dir","/var/lib/kshana-pro","--workers","2"]
    volumes:
      - kshana-pro-data:/var/lib/kshana-pro
    # Bearer token on every route except /health: add
    #   "--api-token-file","/run/secrets/kshana_api_token"
    # to the command and uncomment the secrets entries below and at the end.
    # secrets:
    #   - kshana_api_token
    # No-egress posture: the Kshana engine and Pro overlay make NO external calls and
    # emit NO telemetry (auditable — std-only server, no async/network deps beyond the
    # listening socket). Enforce egress blocking at the enclave's network policy /
    # firewall; this service neither needs nor attempts outbound connectivity.
    # Lockdown: read-only rootfs, no privilege escalation, all capabilities dropped,
    # tmpfs for scratch, bounded resources.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

volumes:
  kshana-pro-data:

# secrets:
#   kshana_api_token:
#     file: ./kshana_api_token.txt   # one line, the token; keep it out of version control
