# /etc/kshana-pro/serve.conf: settings of the kshana-pro systemd service.
# Local-only by default. To serve the network, set an address and add TLS and keys, e.g.
#   KSHANA_PRO_ADDR=0.0.0.0:8443
#   KSHANA_PRO_SERVE_ARGS=--tls-cert /etc/kshana-pro/chain.pem --tls-key /etc/kshana-pro/key.pem --keys-file /etc/kshana-pro/keys.toml
KSHANA_PRO_ADDR=127.0.0.1:8088
KSHANA_PRO_SERVE_ARGS=--workers 2
