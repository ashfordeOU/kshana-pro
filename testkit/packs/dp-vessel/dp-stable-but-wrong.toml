format = "kshana-testkit-scenario/1"
id = "dp-stable-but-wrong"
version = 1
title = "DP vessel on station: stable but wrong GNSS position"
description = "A matched-power counterfeit takes over with an 80 m offset; the fix is steady, with good DOP and quality indicators, and wrong."
modelled_on = ["IMCA IN 1730 theme: a GNSS position that is stable but wrong (modelled on; the note gives no test method)"]
tags = ["maritime", "dp", "spoofing"]

[scene]
start_utc = "2026-03-02T12:00:00Z"
duration_s = 1200

[[signal]]
constellation = "gps"
signals = ["L1CA"]

[[signal]]
constellation = "galileo"
signals = ["E1"]

[trajectory]
platform = "vessel"
lat_deg = 57.10
lon_deg = 1.90

[environment]
sensors = ["gyro", "dp-reference-2"]

[[threat]]
id = "takeover"
type = "spoofing"
technique = "simplistic"
start_s = 300
duration_s = 600
offset_east_m = 60
offset_north_m = 53
power_advantage_db = 1

[expected]
behaviour = "The receiver warns at the takeover; a steady fix with good quality indicators must not be taken as proof of a true position."
withdraw_counts_as_detection = false
misleading_h_error_m = 10
recover_h_error_m = 5

[[criterion]]
id = "detect"
metric = "detection_latency_s"
op = "<="
value = 10
level = 2

[[criterion]]
id = "no-misleading"
metric = "misleading_epochs"
op = "<="
value = 0
level = 2

[[criterion]]
id = "recover"
metric = "recovery_s"
op = "<="
value = 120
level = 1
