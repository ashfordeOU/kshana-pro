# Eurofix LDC smoke scenario: one synthetic chain (positions illustrative, not real
# stations) whose stations carry Eurofix data (tri-state ±1 µs PPM on pulses 3–8,
# balanced patterns, RS(30,10) over GF(2^7), CRC-14 frame check). The on-air format is
# MODELLED from the Eurofix literature until confirmed against the governing standard.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.0
fs_hz = 400000
seed = 7
output_scale_uv_m = 200000.0

[receiver]
type = "static"
lat_deg = 53.5
lon_deg = 2.0

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 4.0

[propagation.ground]
model = "simple"

[[chains]]
name = "chain-E"
gri_us = 67310
ldc = { scheme = "eurofix", gri_us = 67310, auth_key_hex = "4b5348414e412d4c44432d544553542d4b4559", schedule = [
  { type = "station_id", chain_id = 1 },
  { type = "utc_time", tai_minus_utc_s = 37 },
  { type = "almanac", station_code = 77, gri_us = 67310, lat_deg = 54.9, lon_deg = -3.3, power_kw = 250 },
  { type = "almanac", station_code = 88, gri_us = 67310, secondary = true, lat_deg = 57.0, lon_deg = 9.5, emission_delay_us = 13000.0, power_kw = 250 },
  { type = "warning", station_code = 88, kind = "propagation_anomaly", magnitude_ns = 60.0, valid_s = 900 },
  { type = "dloran", reference_site = 12, age_s = 5, corrections = [ { station_code = 77, correction_ns = -42.0 }, { station_code = 88, correction_ns = 17.0 } ] },
  { type = "dgnss", constellation = 0, sats = [ { prn = 3, iode = 21, prc_m = -4.12, rrc_m_s = 0.004, udre = 1 }, { prn = 17, iode = 9, prc_m = 2.5 } ] },
  { type = "auth", key_id = 1, tag_bytes = 8 },
] }
