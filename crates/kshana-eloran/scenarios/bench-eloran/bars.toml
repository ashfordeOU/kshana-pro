# eLoran-Bench v0.1 pass bars (pre-registered: the SHA-256 of this file is in
# registration.toml; any change after registration is detected and scoring is refused).
#
# ILLUSTRATIVE: set by Kshana, not taken from a standard. They were set after observing the
# in-house software receiver on these fixed seeds (roughly 2x its observed errors), so they
# are not blind for that receiver; for any other receiver they are fixed before scoring.
# Metric definitions: crates/kshana-eloran/src/refbench/mod.rs.

benchmark = "eLoran-Bench"
version = "0.1"

# --- ELB-STATIC: fixed site, SNR about 10 dB -------------------------------------------
[[bars]]
scenario = "ELB-STATIC"
metric = "tracked_fraction"
op = "ge"
limit = 1.0
illustrative = true

[[bars]]
scenario = "ELB-STATIC"
metric = "toa_rms_ns"
op = "le"
limit = 60.0
illustrative = true

[[bars]]
scenario = "ELB-STATIC"
metric = "toa_bias_ns"
op = "le"
limit = 25.0
illustrative = true

[[bars]]
scenario = "ELB-STATIC"
metric = "cycle_errors"
op = "eq"
limit = 0.0
illustrative = true

[[bars]]
scenario = "ELB-STATIC"
metric = "ecd_rms_us"
op = "le"
limit = 2.5
illustrative = true

[[bars]]
scenario = "ELB-STATIC"
metric = "snr_error_db"
op = "le"
limit = 2.0
illustrative = true

[[bars]]
scenario = "ELB-STATIC"
metric = "time_error_ns"
op = "le"
limit = 25.0
illustrative = true

