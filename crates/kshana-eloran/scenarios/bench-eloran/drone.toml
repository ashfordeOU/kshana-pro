# eLoran-Bench v0.1 reference scenario ELB-DRONE: drone at 40 m/s on a diagonal track
#
# Synthetic geometry (not real stations). Exact truth comes from the simulator. Not modelled on a
# standard test procedure; the pass bars are in bars.toml, pre-registered by SHA-256 in
# registration.toml. Evidence label: MODELLED.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.2
fs_hz = 400000
seed = 103
output_scale_uv_m = 1000000.0

[receiver]
type = "waypoints"
points = [
  { t_s = 0.0, lat_deg = 55.0, lon_deg = 3.0 },
  { t_s = 3600.0, lat_deg = 55.916000, lon_deg = 4.597000 },
]

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 0.0

[propagation.ground]
model = "simple"

[[interference]]
type = "wgn"
rms_uv_m_20khz = 1600.0
seed = 103

[[chains]]
name = "elb-A"
gri_us = 79800
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 56.5, lon_deg = 1.0 }
power_kw = 400.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 53.5, lon_deg = 1.5 }
power_kw = 400.0
emission_delay_us = 13000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 55.5, lon_deg = 6.5 }
power_kw = 400.0
emission_delay_us = 29000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Z"
role = "secondary"
position = { lat_deg = 53.8, lon_deg = 5.5 }
power_kw = 400.0
emission_delay_us = 46000.0
time_ref = "UTC(A)"

[conformance]
id = "ELB-DRONE"
title = "Dynamic: drone"
category = "dynamic_drone"
intent = """Tracking at drone speed on a diagonal track without cycle errors."""
modelled_on = ["eLoran-Bench v0.1 reference scenario (not modelled on a standard test procedure)"]
to_confirm = ["bars are illustrative: set by Kshana, not taken from a standard", "synthetic geometry and noise levels"]
