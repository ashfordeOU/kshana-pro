# eLoran-Bench v0.1 reference scenario ELB-IMPULSIVE: impulsive noise (motor and switch-mode supply)
#
# Synthetic geometry (not real stations). Exact truth comes from the simulator. Not modelled on a
# standard test procedure; the pass bars are in bars.toml, pre-registered by SHA-256 in
# registration.toml. Evidence label: MODELLED.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.2
fs_hz = 400000
seed = 106
output_scale_uv_m = 1000000.0

[receiver]
type = "static"
lat_deg = 55.0
lon_deg = 3.0

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 0.0

[propagation.ground]
model = "simple"

[[interference]]
type = "wgn"
rms_uv_m_20khz = 260.0
seed = 106

[[interference]]
type = "impulsive"
preset = "motor"
seed = 61

[[interference]]
type = "impulsive"
preset = "smps"
seed = 62

[[chains]]
name = "elb-A"
gri_us = 79800
[[chains.stations]]
