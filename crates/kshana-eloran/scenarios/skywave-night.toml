# Night-time skywave contamination: one synthetic chain (positions illustrative, not real
# stations) received at ~560 and ~830 km, geometric one- and two-hop skywave from the
# E region with ITU-R P.684-style field strength, day/night from the solar zenith angle at
# each path midpoint (December night over the North Sea), slow Rayleigh fading (30 s) and
# WGN.
[scene]
start_utc = "2026-12-21T22:00:00Z"
duration_s = 0.3
fs_hz = 1000000
seed = 11
output_scale_uv_m = 200000.0

[receiver]
type = "static"
lat_deg = 52.0
lon_deg = 4.0

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"

[propagation.ground]
model = "simple"

[propagation.sky]
model = "ionospheric"
# the sun's position is computed from [scene] start_utc; an explicit start_utc here would
# override it
daylight = "auto"
hops = 2
h_day_km = 70.0
h_night_km = 90.0
phase_height_offset_km = 1.0

[propagation.sky.fading]
corr_time_s = 30.0
seed = 7

[[interference]]
type = "wgn"
rms_uv_m_20khz = 10.0

[[chains]]
name = "chain-N"
gri_us = 67310
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 55.0, lon_deg = -3.0 }
power_kw = 250.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 57.5, lon_deg = 13.0 }
power_kw = 400.0
emission_delay_us = 14000.0
time_ref = "UTC(A)"
