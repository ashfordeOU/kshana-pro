# Rail pack (b): GNSS-denied segment, eLoran only.
#
# PURPOSE   A train approaching a dense urban area (route around Newark/Elizabeth, NJ),
#           where GNSS is denied (jamming from vehicles on the adjacent highway, urban
#           canyon, short cuttings). The train's PNT unit must continue on eLoran alone,
#           all-in-view on two chains, with a known time-reference relationship to GNSS.
#           GNSS DEGRADATION IS NOT CONFIGURED HERE: it is set in the GNSS bridge
#           (`kshana-pro eloran gnss`: omit the GNSS half or lower `--cn0` over the segment)
#           or in the COTS GNSS simulator (jamming/obscuration profile), which follows the
#           same trajectory through `sync` (NMEA/CSV export) and the same start epoch
#           (common 10 MHz/1PPS, `gnss_time_residual_ns` for GPST). This file is the
#           eLoran half of that hybrid test.
# EXERCISES Multi-chain all-in-view (9960 and 8970, dual-rated sites), GNSS system time
#           residuals (GPST and GST) carried for the hybrid truth, `smooth_earth` land
#           groundwave, urban impulsive noise (`smps` preset), waypoint track with a stop
#           (dwell between two equal-position waypoints) and heading changes, crossed loops.
# METRICS   Truth: per-station `toa_s`, `delay_ns`, `snr_db`, receiver position/heading
#           (the reference trajectory to score the PNT unit against). Receiver: all-in-view
#           position error (one clock per chain), HDOP, continuity through the segment;
#           against the GNSS half: time offset eLoran − GNSS = UTC(USNO) offset − GPST
#           residual (consistent by construction).
# DURATION  2 s in the file; the segment lasts 560 s (≈ 44 m/s, with a 60 s stop). The test suite overrides `duration_s`
#           to 0.3 s.
# PROVENANCE Chain geometry: GRI DB entries `9960-northeast-us` and `8970-great-lakes` (USCG
#           Loran-C User Handbook 1992, Table B-1; "verified"; terminated 2010). Dual-rated
#           blanking is NOT modelled. Track, stop and noise levels are ILLUSTRATIVE.
[scene]
start_utc = "2026-11-18T13:00:00Z"
duration_s = 2.0
fs_hz = 1000000
seed = 302
output_scale_uv_m = 150000.0

[receiver]
type = "waypoints"
points = [
  { t_s = 0.0,   lat_deg = 40.580, lon_deg = -74.290, h_m = 20.0 },
  { t_s = 260.0, lat_deg = 40.664, lon_deg = -74.211, h_m = 15.0, heading_deg = 40.0 },  # stop begins (heading given: zero-length segment)
  { t_s = 320.0, lat_deg = 40.664, lon_deg = -74.211, h_m = 15.0, heading_deg = 40.0 },  # stopped
  { t_s = 460.0, lat_deg = 40.705, lon_deg = -74.160, h_m = 10.0 },
  { t_s = 560.0, lat_deg = 40.735, lon_deg = -74.165, h_m = 10.0 },   # turn north
]

[[outputs]]
type = "h_loop"
axis_deg = 0.0
[[outputs]]
type = "h_loop"
axis_deg = 90.0

[[time_refs]]
id = "UTC(USNO)"
offset_ns = 0.2

[gnss_time_residual_ns]
Gpst = 1.5
Gst = -2.5

[propagation.ground]
model = "smooth_earth"
sigma_s_m = 0.005
eps_r = 15.0

[[interference]]
type = "impulsive"
preset = "smps"
gain_db = -6.0
seed = 21

[[interference]]
type = "wgn"
rms_uv_m_20khz = 30.0
seed = 22

[[chains]]
name = "9960"             # GRI DB 9960-northeast-us
gri_us = 99600
