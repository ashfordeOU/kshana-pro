# Synthetic smoke scenario: two made-up chains (positions are illustrative, not real
# stations), two UTC(k) references, crossed-loop H-field receiver on a moving ship.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.0
fs_hz = 2000000
seed = 42
output_scale_uv_m = 200000.0

[receiver]
type = "waypoints"
points = [
  { t_s = 0.0,  lat_deg = 55.000, lon_deg = 3.000 },
  { t_s = 60.0, lat_deg = 55.003, lon_deg = 3.000 },
]

[[outputs]]
type = "h_loop"
axis_deg = 0.0
[[outputs]]
type = "h_loop"
axis_deg = 90.0

[[time_refs]]
id = "UTC(A)"
offset_ns = 3.0
[[time_refs]]
id = "UTC(B)"
offset_ns = -12.0
drift_ns_per_day = 2.0

[propagation.ground]
model = "simple"

[[interference]]
type = "wgn"
rms_uv_m_20khz = 20.0

[[chains]]
name = "chain-A"
gri_us = 67310
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 54.9, lon_deg = -3.3 }
power_kw = 250.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 57.0, lon_deg = 9.5 }
power_kw = 250.0
emission_delay_us = 13000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 52.0, lon_deg = 5.0 }
power_kw = 250.0
emission_delay_us = 29000.0
time_ref = "UTC(A)"

[[chains]]
name = "chain-B"
gri_us = 74990
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 62.0, lon_deg = 5.0 }
power_kw = 400.0
time_ref = "UTC(B)"
[[chains.stations]]
id = "W"
role = "secondary"
position = { lat_deg = 58.5, lon_deg = 15.0 }
power_kw = 400.0
emission_delay_us = 15000.0
time_ref = "UTC(B)"
