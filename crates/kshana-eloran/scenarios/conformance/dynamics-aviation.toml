# CONFORMANCE CASE CONF-DYN-02: Dynamics: aircraft speed
#
# MODELLED ON the kind of test described in eLoran / Loran-C receiver performance standards
# (RTCM SC-127 Minimum Performance Standards for eLoran receivers). The standards' texts were NOT consulted: stimulus levels and limits are
# ILLUSTRATIVE and must be confirmed (see `to_confirm`). Synthetic geometry (not real
# stations) unless stated.
#
# PURPOSE  Receiver moving north at 120 m/s. A 4-GRI tracking window spans about 38 m of motion
#          (about 130 ns of delay change): the batch receiver's per-window constant-arrival
#          assumption is what is being exercised.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.2
fs_hz = 400000
seed = 12
output_scale_uv_m = 1000000.0

[receiver]
type = "waypoints"
points = [
  { t_s = 0.0, lat_deg = 55.0, lon_deg = 3.0 },
  { t_s = 3600.0, lat_deg = 58.884892, lon_deg = 3.0 },
]

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 0.0

[propagation.ground]
model = "simple"

[[interference]]
type = "wgn"
rms_uv_m_20khz = 2600.0
seed = 12

[[chains]]
name = "conf-A"
gri_us = 79800
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 56.5, lon_deg = 1.0 }
power_kw = 400.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 53.5, lon_deg = 1.5 }
power_kw = 400.0
emission_delay_us = 13000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 55.5, lon_deg = 6.5 }
power_kw = 400.0
emission_delay_us = 29000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Z"
role = "secondary"
position = { lat_deg = 53.8, lon_deg = 5.5 }
power_kw = 400.0
emission_delay_us = 46000.0
time_ref = "UTC(A)"

[conformance]
id = "CONF-DYN-02"
title = "Dynamics: aircraft speed"
category = "dynamics"
intent = """Tracking without cycle errors at aircraft speed."""
modelled_on = ["RTCM SC-127 Minimum Performance Standards for eLoran receivers — dynamic performance (aviation) (text not consulted)"]
to_confirm = ["test procedure and stimulus definitions of the governing standard", "noise definition (bandwidth, field vs voltage reference, atmospheric vs Gaussian)", "pass limits (all limits here are ILLUSTRATIVE)", "speed/acceleration profiles for the aviation class", "accuracy requirement under motion"]
requirements = ["REQ-RX-DYN"]

[[conformance.variations]]
label = "120mps"
stimulus = { speed_mps = 120 }
set = {  }

[[conformance.criteria]]
metric = "tracked_fraction"
op = "ge"
limit = 1.0
illustrative = true

[[conformance.criteria]]
metric = "toa_rms_ns"
op = "le"
limit = 150.0
illustrative = true

[[conformance.criteria]]
metric = "cycle_errors"
op = "eq"
limit = 0.0
illustrative = true
