# CONFORMANCE CASE CONF-TIM-01: Timing accuracy at a known position
#
# MODELLED ON the kind of test described in eLoran / Loran-C receiver performance standards
# (RTCM SC-127 Minimum Performance Standards for eLoran receivers). The standards' texts were NOT consulted: stimulus levels and limits are
# ILLUSTRATIVE and must be confirmed (see `to_confirm`). Synthetic geometry (not real
# stations) unless stated.
#
# PURPOSE  Time solution at the known receiver position: the chain's reference runs 50 ns ahead
#          of UTC; the receiver must recover UTC(A) - receiver per station.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.2
fs_hz = 400000
seed = 13
output_scale_uv_m = 1000000.0

[receiver]
type = "static"
lat_deg = 55.0
lon_deg = 3.0

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 50.0

[propagation.ground]
model = "simple"

[[interference]]
type = "wgn"
rms_uv_m_20khz = 2600.0
seed = 13

[[chains]]
name = "conf-A"
gri_us = 79800
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 56.5, lon_deg = 1.0 }
power_kw = 400.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 53.5, lon_deg = 1.5 }
power_kw = 400.0
emission_delay_us = 13000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 55.5, lon_deg = 6.5 }
power_kw = 400.0
emission_delay_us = 29000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Z"
role = "secondary"
position = { lat_deg = 53.8, lon_deg = 5.5 }
power_kw = 400.0
emission_delay_us = 46000.0
time_ref = "UTC(A)"

[conformance]
id = "CONF-TIM-01"
title = "Timing accuracy at a known position"
category = "timing_accuracy"
intent = """Recovered time offset within a bound of truth for each station."""
modelled_on = ["RTCM SC-127 Minimum Performance Standards for eLoran receivers — timing receiver accuracy (text not consulted)", "ITU-T G.8272.1 enhanced PRTC — cited only as the kind of timing target eLoran backup is compared with (text not consulted)"]
to_confirm = ["test procedure and stimulus definitions of the governing standard", "noise definition (bandwidth, field vs voltage reference, atmospheric vs Gaussian)", "pass limits (all limits here are ILLUSTRATIVE)", "timing accuracy requirement and averaging time", "treatment of ASF/calibration (simple PF-only propagation here)"]
requirements = ["REQ-RX-TIME"]

[[conformance.variations]]
label = "snr20"
stimulus = { snr_nominal_db = 20 }
set = { "interference[0].rms_uv_m_20khz" = 2600.0 }

[[conformance.variations]]
label = "snr10"
stimulus = { snr_nominal_db = 10 }
set = { "interference[0].rms_uv_m_20khz" = 8221.9 }

[[conformance.criteria]]
metric = "time_error_ns"
op = "le"
limit = 50.0
illustrative = true

[[conformance.criteria]]
metric = "tracked_fraction"
op = "ge"
limit = 1.0
illustrative = true
