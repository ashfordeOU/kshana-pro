# CONFORMANCE CASE CONF-ECD-01: ECD tolerance
#
# MODELLED ON the kind of test described in eLoran / Loran-C receiver performance standards
# (RTCM SC-127 Minimum Performance Standards for eLoran receivers; IEC 61075 Loran-C receivers for ships (performance requirements, methods of testing)). The standards' texts were NOT consulted: stimulus levels and limits are
# ILLUSTRATIVE and must be confirmed (see `to_confirm`). Synthetic geometry (not real
# stations) unless stated.
#
# PURPOSE  Station X transmits an envelope-to-cycle difference offset; the receiver (configured with
#          zero expected ECD) must still identify the cycle and report the ECD.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.2
fs_hz = 400000
seed = 8
output_scale_uv_m = 1000000.0

[receiver]
type = "static"
lat_deg = 55.0
lon_deg = 3.0

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 0.0

[propagation.ground]
model = "simple"

[[interference]]
type = "wgn"
rms_uv_m_20khz = 2600.0
seed = 8

[[chains]]
name = "conf-A"
gri_us = 79800
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 56.5, lon_deg = 1.0 }
power_kw = 400.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 53.5, lon_deg = 1.5 }
power_kw = 400.0
emission_delay_us = 13000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 55.5, lon_deg = 6.5 }
power_kw = 400.0
emission_delay_us = 29000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Z"
role = "secondary"
position = { lat_deg = 53.8, lon_deg = 5.5 }
power_kw = 400.0
emission_delay_us = 46000.0
time_ref = "UTC(A)"

[conformance]
id = "CONF-ECD-01"
title = "ECD tolerance"
category = "ecd_tolerance"
intent = """Correct cycle identification and ECD estimate for transmitted ECD offsets."""
modelled_on = ["RTCM SC-127 Minimum Performance Standards for eLoran receivers — ECD tolerance (text not consulted)", "IEC 61075 Loran-C receivers for ships (performance requirements, methods of testing) — envelope-to-cycle discrepancy (text not consulted)"]
to_confirm = ["test procedure and stimulus definitions of the governing standard", "noise definition (bandwidth, field vs voltage reference, atmospheric vs Gaussian)", "pass limits (all limits here are ILLUSTRATIVE)", "ECD offsets to apply and where (transmitted vs propagation)", "ECD estimate accuracy requirement"]
requirements = ["REQ-RX-ECD"]

[[conformance.variations]]
label = "ecdm2_0us"
stimulus = { ecd_us = -2.0 }
set = { "chains[0].stations[1].ecd_us" = -2.0 }

[[conformance.variations]]
label = "ecdp1_5us"
stimulus = { ecd_us = 1.5 }
set = { "chains[0].stations[1].ecd_us" = 1.5 }

[[conformance.variations]]
label = "ecdp3_0us"
stimulus = { ecd_us = 3.0 }
set = { "chains[0].stations[1].ecd_us" = 3.0 }

[[conformance.criteria]]
metric = "cycle_errors"
op = "eq"
limit = 0.0
illustrative = true

[[conformance.criteria]]
metric = "ecd_rms_us"
op = "le"
limit = 0.5
illustrative = true
target = "conf-A/X"

[[conformance.criteria]]
metric = "toa_rms_ns"
op = "le"
limit = 50.0
illustrative = true
