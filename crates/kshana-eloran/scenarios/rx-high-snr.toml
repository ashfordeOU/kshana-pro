# Receiver test (S10): one chain, four stations, no noise, E-field antenna, simple
# groundwave (PF only, so the receiver's prediction is exact). The chain's time reference
# runs 50 ns ahead of UTC and station X transmits a 1.5 µs ECD.
# Synthetic geometry (not real stations).
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.2
fs_hz = 1000000
seed = 1
output_scale_uv_m = 1000000.0

[receiver]
type = "static"
lat_deg = 55.0
lon_deg = 3.0

[[outputs]]
type = "e_field"

[[time_refs]]
id = "UTC(A)"
offset_ns = 50.0

[propagation.ground]
model = "simple"

[[chains]]
name = "rx-A"
gri_us = 79800
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 56.5, lon_deg = 1.0 }
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 53.5, lon_deg = 1.5 }
emission_delay_us = 13000.0
time_ref = "UTC(A)"
ecd_us = 1.5
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 55.5, lon_deg = 6.5 }
emission_delay_us = 29000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Z"
role = "secondary"
position = { lat_deg = 53.8, lon_deg = 5.5 }
emission_delay_us = 46000.0
time_ref = "UTC(A)"
