# Groundwave mixed-path scenario: the two synthetic chains of synthetic-two-chain.toml
# (positions illustrative, not real stations) with the full groundwave model: PF/SF from
# smooth-earth theory, ASF by Millington's method over a polygon conductivity map
# (illustrative land masses, not a real coastline), dispersion ECD and a diurnal/seasonal
# ASF term. Receiver on a ship in the open sea.
[scene]
start_utc = "2026-11-18T00:00:00Z"
duration_s = 1.0
fs_hz = 2000000
seed = 42
output_scale_uv_m = 200000.0

[receiver]
type = "waypoints"
points = [
  { t_s = 0.0,  lat_deg = 55.000, lon_deg = 3.000 },
  { t_s = 60.0, lat_deg = 55.003, lon_deg = 3.000 },
]

[[outputs]]
type = "h_loop"
axis_deg = 0.0
[[outputs]]
type = "h_loop"
axis_deg = 90.0

[[time_refs]]
id = "UTC(A)"
offset_ns = 3.0
[[time_refs]]
id = "UTC(B)"
offset_ns = -12.0
drift_ns_per_day = 2.0

[propagation.ground]
model = "millington"
k_factor = 1.24          # LORAN calibration (Harris/Johler seawater SF); 1.3333 = ITU
sample_km = 2.0
asf_grid_deg = 0.005

[propagation.ground.conductivity]
type = "polygons"
background = { sigma_s_m = 5.0, eps_r = 80.0 }
[[propagation.ground.conductivity.polygons]]
name = "western land"
sigma_s_m = 0.003
eps_r = 15.0
vertices = [[50.0, -8.0], [59.0, -8.0], [59.0, -1.5], [50.0, -1.5]]
[[propagation.ground.conductivity.polygons]]
name = "eastern land"
sigma_s_m = 0.01
eps_r = 30.0
vertices = [[53.0, 7.5], [58.0, 7.5], [58.0, 20.0], [53.0, 20.0]]
[[propagation.ground.conductivity.polygons]]
name = "northern mountains"
sigma_s_m = 0.001
vertices = [[58.0, 4.5], [65.0, 4.5], [65.0, 20.0], [58.0, 20.0]]
[[propagation.ground.conductivity.polygons]]
name = "southern land"
sigma_s_m = 0.005
eps_r = 15.0
vertices = [[48.0, 2.0], [52.5, 2.0], [52.5, 8.0], [48.0, 8.0]]

[propagation.ground.temporal]
epoch_day_of_year = 322.0   # 2026-11-18
epoch_hour_utc = 0.0
diurnal_amp_ns = 15.0
diurnal_peak_hour_utc = 14.0
seasonal_amp_ns = 40.0
seasonal_peak_day = 200.0
sigma_seasonal_frac = 0.1
sigma_peak_day = 30.0

[[interference]]
type = "wgn"
rms_uv_m_20khz = 20.0

[[chains]]
name = "chain-A"
gri_us = 67310
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 54.9, lon_deg = -3.3 }
power_kw = 250.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "X"
role = "secondary"
position = { lat_deg = 57.0, lon_deg = 9.5 }
power_kw = 250.0
emission_delay_us = 13000.0
time_ref = "UTC(A)"
[[chains.stations]]
id = "Y"
role = "secondary"
position = { lat_deg = 52.0, lon_deg = 5.0 }
power_kw = 250.0
emission_delay_us = 29000.0
time_ref = "UTC(A)"

[[chains]]
name = "chain-B"
gri_us = 74990
[[chains.stations]]
id = "M"
role = "master"
position = { lat_deg = 62.0, lon_deg = 5.0 }
power_kw = 400.0
time_ref = "UTC(B)"
[[chains.stations]]
id = "W"
role = "secondary"
position = { lat_deg = 58.5, lon_deg = 15.0 }
power_kw = 400.0
emission_delay_us = 15000.0
time_ref = "UTC(B)"
