[package]
name = "kshana-eloran"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Kshana Pro eLoran/GNSS signal simulation engine (proprietary)"
authors = ["Chakshu Baweja <contact@ashforde.org>"]
# CLOSED: proprietary Kshana Pro component. Never publish.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"

# dlopen for the optional SoapySDR hardware driver (feature `soapy`, unix only).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
# SoapySDR 0.8 hardware output/capture, opened at run time with dlopen (no link dependency).
soapy = ["dep:libc"]

[dev-dependencies]
