# Kshana Pro AWG profile: generic IEEE 488.2-style instrument, binary upload.
#
# ILLUSTRATIVE ONLY. The command names below are neutral placeholders in the general style
# of SCPI; they are NOT the command set of any particular vendor or model. Copy this file,
# replace every command with the one from your instrument's programming manual, and load it
# with `ScpiProfile::load(path)`.
#
# Placeholders: {ch} instrument channel (1-based), {name} waveform name, {len} points,
# {block} IEEE 488.2 definite-length binary block, {data} comma-separated values,
# {rate} sample rate (Sa/s), {vpp} full-scale amplitude (Vpp), {offset} offset (V).
name = "generic-binary"
description = "Generic IEEE 488.2-like AWG, int16 little-endian binary block upload (placeholder commands)"
port = 5025
terminator = "\n"
max_points = 1048576
min_points = 8
granularity = 1
dac_bits = 16
data_format = "int16_le_block"
idn = "*IDN?"
error_query = "SYST:ERR?"
no_error = "0"
opc = "*OPC?"
init = ["*CLS"]
upload = ["WAVE{ch}:DATA {name},{block}"]
select = ["WAVE{ch}:SEL {name}"]
sample_rate = ["WAVE{ch}:SRAT {rate}"]
amplitude = ["OUTP{ch}:AMPL {vpp}"]
offset = ["OUTP{ch}:OFFS {offset}"]
loop_continuous = ["WAVE{ch}:MODE CONT"]
loop_once = ["WAVE{ch}:MODE ONCE"]
ref_external = ["REF:SOUR EXT"]
ref_internal = ["REF:SOUR INT"]
trigger_external = ["TRIG{ch}:SOUR EXT"]
trigger_immediate = ["TRIG{ch}:SOUR IMM"]
software_trigger = ["*TRG"]
output_on = ["OUTP{ch} ON"]
output_off = ["OUTP{ch} OFF"]
