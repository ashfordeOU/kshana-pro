[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kshana-eloran"
version = "0.1.0"
description = "Python SDK for the Kshana Pro eLoran/GNSS simulator (proprietary)"
requires-python = ">=3.9"
license = { text = "Proprietary - see LICENSE in the kshana-pro repository" }
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]

[tool.setuptools]
packages = ["kshana_eloran"]
