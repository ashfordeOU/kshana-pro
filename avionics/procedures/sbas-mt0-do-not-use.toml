format = "kshana-avionics-procedure/1"
id = "sbas-mt0-do-not-use"
version = 1
title = "SBAS: message type 0 takes the equipment out of SBAS-based modes"
purpose = "MT0 is broadcast every second for 60 s. The equipment leaves every SBAS-based mode within the alert time of the first MT0."
kind = "sbas-sequence"
modelled_on = ["RTCA DO-229F, Appendix A (message type 0)", "RTCA DO-229F, Section 2 (time to alert; value supplied by the applicant)"]
tags = ["sbas", "message-type-0"]

[[parameter]]
name = "alert_time_s"
unit = "s"
meaning = "from the first MT0 to the equipment in no SBAS-based mode"
source = "applicant: from their copy of RTCA DO-229F"

[sequence]
duration_s = 240
prns = [1, 3, 6, 9, 12, 14, 17]

[[sequence.event]]
id = "mt0"
kind = "do_not_use"
t_s = 120
duration_s = 60
