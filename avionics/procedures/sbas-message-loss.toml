format = "kshana-avionics-procedure/1"
id = "sbas-message-loss"
version = 1
title = "SBAS: loss of SBAS messages takes the equipment out of SBAS-based modes"
purpose = "No SBAS frame for 45 s (the GEO signal carries no data). The equipment leaves SBAS-based modes within the applicant's message-loss limit, counted from the last frame."
kind = "sbas-sequence"
modelled_on = ["RTCA DO-229F, Section 2 (loss of SBAS messages; limit supplied by the applicant)"]
tags = ["sbas", "continuity"]

[[parameter]]
name = "message_loss_s"
unit = "s"
meaning = "from the last SBAS frame to the equipment in no SBAS-based mode"
source = "applicant: from their copy of RTCA DO-229F for the operation under test"

[sequence]
duration_s = 240
prns = [1, 3, 6, 9, 12, 14, 17]

[[sequence.event]]
id = "silence"
kind = "silence"
t_s = 120
duration_s = 45
