# Kshana Pro threat library: scenario file (format kshana-pro-threat-scenario/1).
# A description and a parameter set, not a measurement. No source data is included.
format = "kshana-pro-threat-scenario/1"
id = "texbat-ds4-matched-power-position-push"
version = 1
title = "TEXBAT ds4: matched-power position push on a static receiver"
family = "texbat"
threat = ["spoofing"]
domain = "land-static"
period = "Recorded for the Texas Spoofing Test Battery, published 2012"
summary = """
TEXBAT's static matched-power position push (ds4) captures a static receiver at nearly the \
authentic power and then moves its reported position. The analogue moves a static receiver's \
fix away by 600 m at a matched level, so the C/N0 pattern stays genuine."""

[provenance]
class = "published-dataset"
parameter_basis = """
Representative values, not read off the recordings: a 600 m drag-off over 5 minutes with the \
genuine C/N0 pattern kept. TEXBAT's own push profile and power advantage are given in its \
description; use those when you replay the recording."""
verify_before_use = "Check the scenario number against the TEXBAT description before use."

[[provenance.source]]
title = "The Texas Spoofing Test Battery: Toward a Standard for Evaluating GPS Signal Authentication Techniques"
publisher = "T. E. Humphreys, J. A. Bhatti, D. P. Shepard and K. D. Wesson, Proceedings of ION GNSS 2012"
date = "2012-09"
citation = "Proc. ION GNSS 2012, Institute of Navigation"
says = "Describes the TEXBAT recordings, including static matched-power time and position pushes."

[[provenance.source]]
title = "TEXBAT data distribution"
publisher = "University of Texas Radionavigation Laboratory"
date = "2012 onwards"
url = "https://radionavlab.ae.utexas.edu/"
says = "The laboratory distributes the recordings to users under its own terms."

