#
# PICS v1 clause mapping. Each row ties scenarios of pics/suite-v1.toml to a provision of a
# standard or framework. Rule (no invented standards text): a row cites a clause number only
# where the research behind PICS, or a source the open engine has read and transcribed,
# gives one, and names that source in `basis`; every other row says exactly
# "mapping to be confirmed" in `clause`. Topics are Kshana's paraphrase, never a quotation.
# A mapping says which scenario produces evidence relevant to the provision; it never says a
# device meets the provision. Limits in the bars are illustrative until confirmed against the
# standard.
#
# Research: vcprep records/ops/kshana/research-2026-11-19/02-maritime-aviation-timing.md
# (sections 1.1, 2.1, 3.1 and gap rows 1, 7, 8, 14).

[[standard]]
id = "imo-msc-401-95"
title = "IMO Resolution MSC.401(95): performance standards for multi-system shipborne radionavigation receivers (8 Jun 2015)"
status = "Adopted; performance only, no threat or spoofing test cases (research 1.1, source M1)"

[[standard]]
id = "imo-msc1-circ-1575"
title = "IMO MSC.1/Circ.1575: guidelines for shipborne PNT data processing (16 Jun 2017)"
status = "Guidelines; read in full by the open engine's imo-circ-1575 standards pack (2026-10-18)"

[[standard]]
id = "iec-61108-1"
title = "IEC 61108-1 Ed. 2.0 (2003): GPS shipborne receiver, performance and test methods"
status = "Current per the listings found; no spoofing, multi-system or time-jump tests (research 1.1, source M5)"

[[standard]]
id = "eurocae-ed-259a"
title = "EUROCAE ED-259A (Oct 2023): DFMC SBAS airborne equipment MOPS"
status = "Published; Appendix W (informative) classifies spoofing signals (research 2.1, source A8)"

[[standard]]
id = "rtca-do-401a"
title = "RTCA DO-401A / EUROCAE ED-259B (in work, SC-159 / WG-62)"
status = "Draft: adds jamming and spoofing robustness, RFI detection and indicator; spoofing indicator still under development (research 2.1, sources A9, A11)"

[[standard]]
id = "ieee-p1952"
title = "IEEE P1952: resilient PNT user equipment (draft)"
status = "Draft standard, PAR approved 21 May 2021, still active (research 3.1, sources T3, T4); no clause numbers until published"

[[standard]]
id = "dhs-rpcf"
title = "DHS / CISA Resilient PNT Conformance Framework, v2.0"
status = "Framework of four resilience levels (research 3.1, source T2); no accredited lab programme found"

[[standard]]
id = "itu-t-g8272-1"
title = "ITU-T G.8272.1 (2024) Amd. 1 (07/2025): enhanced primary reference time clock (ePRTC)"
status = "In force; clause and table numbers as transcribed by the open engine's telecom_timing module (research 3.1, source T10)"

[[standard]]
id = "itu-t-g8273-2"
title = "ITU-T G.8273.2/Y.1368.2 (2023) Amd. 2 (11/2025): telecom boundary and slave clocks"
status = "In force; table numbers as transcribed by the open engine's telecom_timing module (research 3.1, source T10)"

[[standard]]
id = "ieee-c37-238"
title = "IEEE C37.238-2017 (+a-2023): PTP power profile"
status = "In force; adds time-inaccuracy TLV monitoring, example budget +/-1 us (research 3.1, source T12)"

