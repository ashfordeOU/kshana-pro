recover_h_error_m = 10.0
recover_time_error_ns = 50.0
bounded_h_error_m = 100.0
bounded_time_error_ns = 1000.0
full_availability = 0.95
full_h_error_m = 10.0
full_time_error_ns = 50.0

# ---------------------------------------------------------------------------------------
# Spoofing
# ---------------------------------------------------------------------------------------

[[scenario]]
id = "PICS-SPF-SIMPLE"
class = "spoofing"
technique = "simplistic"
domains = ["position", "timing"]
title = "Simplistic spoofer: unsynchronised signals for a false position 10 km away"
expected = "The device raises an explicit spoofing or integrity flag within 5 s of onset and never reports the false position (or the matching time step) as valid and unflagged; correct output within 60 s of the spoofer being switched off."
[scenario.params]
false_offset_east_m = 10000.0
false_offset_north_m = 0.0
time_offset_ns = 0.0
power_advantage_db = 10.0
synchronised = 0.0
[scenario.bars]
explicit_flag_required = true
detect_within_s = 5.0
max_unflagged_h_error_m = 50.0
max_unflagged_time_error_ns = 100.0
recover_within_s = 60.0
recover_h_error_m = 10.0
recover_time_error_ns = 50.0
bounded_h_error_m = 100.0
bounded_time_error_ns = 1000.0
full_availability = 0.95
full_h_error_m = 10.0
full_time_error_ns = 50.0

[[scenario]]
id = "PICS-SPF-INTER"
class = "spoofing"
technique = "intermediate"
domains = ["position", "timing"]
title = "Intermediate spoofer: code- and carrier-aligned takeover, then a 1 m/s position drag"
expected = "The device raises an explicit spoofing or integrity flag before its horizontal error passes 50 m (that is, within 50 s of the drag starting), and is correct within 60 s after the spoofer is off."
[scenario.params]
takeover_s = 20.0
drag_rate_mps = 1.0
drag_bearing_deg = 90.0
power_advantage_db = 3.0
synchronised = 1.0
[scenario.bars]
explicit_flag_required = true
detect_within_s = 70.0
max_unflagged_h_error_m = 50.0
max_unflagged_time_error_ns = 100.0
recover_within_s = 60.0
recover_h_error_m = 10.0
recover_time_error_ns = 50.0
bounded_h_error_m = 100.0
bounded_time_error_ns = 1000.0
full_availability = 0.95
full_h_error_m = 10.0
full_time_error_ns = 50.0

[[scenario]]
id = "PICS-SPF-TPUSH"
class = "spoofing"
technique = "time-push"
domains = ["timing"]
title = "Time push: synchronised spoofer walking GNSS time at 10 ns/s, position held"
expected = "A timing device raises an explicit flag or leaves GNSS for holdover before its time error passes 100 ns unflagged (within 10 s of the push starting), keeps its time error within 1 us over the threat, and is back within 50 ns within 60 s after the spoofer is off."
[scenario.params]
takeover_s = 20.0
push_rate_ns_per_s = 10.0
power_advantage_db = 3.0
synchronised = 1.0
[scenario.bars]
explicit_flag_required = true
detect_within_s = 30.0
max_unflagged_time_error_ns = 100.0
recover_within_s = 60.0
recover_time_error_ns = 50.0
bounded_time_error_ns = 1000.0
full_availability = 0.95
full_time_error_ns = 50.0

[[scenario]]
id = "PICS-SPF-DRAG"
class = "spoofing"
technique = "position-drag"
domains = ["position"]
title = "Position drag: accelerating walk-off at 0.05 m/s2 up to 5 m/s, time held"
