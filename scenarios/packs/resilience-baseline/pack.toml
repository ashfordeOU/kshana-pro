# Pack C — versioned, subscribable PNT-resilience scenario pack.
#
# A customer subscribes to this pack by id + version and runs their own
# config/model against it in CI each build. The pack content hash (over id +
# version + entries) pins exactly which pack produced a run; the per-scenario
# hashes pin each scenario. Both scenarios below are deterministic given their
# seed, fast (well under a second each), and emit known-direction figures of
# merit so the regression gate is meaningful.
id = "resilience-baseline"
version = "1.0.0"
description = "Baseline PNT-resilience scenario pack: a measurement-domain ARAIM availability run (HPL/VPL, fault detection) plus an RF-impairment detection evaluation. MODELLED scenarios for decision-support in your own CI, not a certification."

# Measurement-domain GNSS simulation: synthesised pseudoranges (iono/tropo/noise/
# multipath) fed to snapshot RAIM. Emits raim_availability (higher-is-better) and
# mean_hpl_m / mean_vpl_m / fault_rate (lower-is-better).
[[entries]]
path = "araim.toml"
label = "araim"

# AI/ML RF-impairment detection evaluation over a synthetic, parameter-grounded
# corpus (never field IQ). Emits AUC and the in- vs out-of-distribution figures.
[[entries]]
path = "impairment.toml"
label = "impairment"
