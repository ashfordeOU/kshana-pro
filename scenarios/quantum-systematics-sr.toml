# Kshana Pro premium fidelity (PR19) — quantum-clock systematics budget.
#
# The "full-physics" upgrade over the open core's coefficient-level clock: the
# deterministic systematic frequency shifts of an optical-lattice clock and their
# residual uncertainty floor. Coefficients are CITED published inputs (substitute a
# target clock's values); the formulas (BBR ∝ T^4, redshift = g·h/c², Zeeman ∝ B²)
# are the framework.
#
# Run:  kshana-pro run scenarios/quantum-systematics-sr.toml --dev
#   (Pro tier; or --license <pro-or-enterprise token>)
kind = "pro-quantum-systematics"
species = "Sr optical lattice (representative — substitute target clock)"

bbr_coeff_300k = -2.35e-14   # published Sr BBR fractional shift at 300 K (cited)
temperature_k = 295.0        # operating temperature

zeeman_coeff_per_t2 = -2.3e-2  # 2nd-order Zeeman coefficient (fractional / T^2)
magnetic_field_t = 1.0e-4      # 1 Gauss bias field

altitude_m = 400000.0        # ~LEO altitude → gravitational redshift dominates

rel_uncertainty = 0.02       # 2% per-effect 1σ uncertainty

# Extra effects supplied directly (name, fractional shift, abs uncertainty):
[[extra]]
name = "ac-stark-lattice"
fractional_shift = 5.0e-16
uncertainty = 2.0e-16

[[extra]]
name = "collisional"
fractional_shift = -3.0e-17
uncertainty = 1.0e-17
