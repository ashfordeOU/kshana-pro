# Kshana Pro scale enhancement (PR20) — parallel Monte-Carlo.
#
# Fan one clock scenario across many seeds, run them concurrently on the embedded
# open engine, and aggregate the timing figure of merit (mean / std / p05 / p95).
# The aggregate is identical regardless of thread count (each run is deterministic
# in its seed) — parallelism only buys wall-clock.
#
# Run:  kshana-pro run scenarios/batch-clock-mc.toml
kind = "pro-batch"
title = "CSAC timing-error Monte-Carlo (GNSS-denied holdover)"
metric = "quantum.fom.timing_p95_ns"
seed_count = 64        # 64 seeds
seed_start = 1
# max_threads omitted → uses all available cores.

base_scenario = """
kind = "clock"
seed = 1
threshold_ns = 20.0
[time]
step_s = 10.0
duration_s = 7200.0
[gnss]
windows = [
  { t0 = 0.0,   t1 = 600.0,  state = "nominal" },
  { t0 = 600.0, t1 = 7200.0, state = "denied" },
]
[clock_quantum]
id = "csac-sa45s"
provenance = "CSAC sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2"
y0 = 0.0
q_wf = 9.0e-20
q_rw = 0.0
[clock_classical]
id = "csac-sa45s"
provenance = "CSAC sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2"
y0 = 0.0
q_wf = 9.0e-20
q_rw = 0.0
"""
