# Worked example of a Kshana Pro mission dossier: one programme over five runs of the
# open Kshana engine, on public data only (see PROVENANCE.md for every file's source).
#
#   kshana-pro mission build scenarios/pro-power/mission/programme.toml --out out/ --dev
#
# The five scenario files are the open engine's own examples, copied unchanged. The
# requirements and their limits are illustrative: they were written for this example
# and are no agency's or operator's.
title = "Navigation resilience programme: Earth, Moon and Mars"
reference = "KP-MD-0001"
issue = "1"
classification = "Unclassified"
requirements = "requirements.csv"

[[scenario]]
id = "RUN-LEO"
path = "leo-pnt-end-to-end.toml"
description = "Low Earth orbit (LEO) positioning, navigation and timing chain on a generic 1080 km constellation: signal, pass, navigation message, fused fix, precise point positioning."
figures = [
  "fusion.gnss.median_pdop",
  "fusion.fused.median_pdop",
  "fusion.fused.availability",
  "fusion.fraction_epochs_with_leo",
  "pass.peak_cn0_dbhz",
  "pass.peak_tracked_cn0_dbhz",
  "pass.duration_above_mask_s",
  "pass.max_elevation_deg",
  "ppp.cases[0].fraction_converged",
  "ppp.cases[1].fraction_converged",
]

[[scenario.chart]]
title = "Carrier-to-noise density over the pass"
x = "series.t_s"
y = ["series.cn0_dbhz", "series.tracked_cn0_dbhz"]

[[scenario.chart]]
title = "Position dilution of precision, GNSS alone and with the LEO layer"
x = "fusion.epochs.t_s"
y = ["fusion.epochs.pdop_gnss", "fusion.epochs.pdop_fused"]

[[scenario]]
id = "RUN-LUNAR"
path = "lunar-relay-constellation.toml"
description = "A 14-satellite lunar relay and navigation constellation, scored as a coverage and dilution-of-precision map over the whole Moon for one day."
figures = [
  "global.availability_pct",
  "global.worst_site_availability_pct",
  "global.fix_pct",
  "global.pdop.median",
  "global.pdop.p95",
  "global.mean_visible",
  "global.min_visible",
  "total_satellites",
]

[[scenario.chart]]
title = "Availability along four latitudes (85 S, 45 S, 5 N, 85 N), by longitude"
x = "grid.lon_deg"
y = [
  "grid.availability_pct[0]",
  "grid.availability_pct[4]",
  "grid.availability_pct[9]",
  "grid.availability_pct[17]",
]

[[scenario]]
id = "RUN-SPECTRUM"
path = "l-band-waterfall-jamming.toml"
description = "The L band under a scripted sequence of three jammers: which navigation signals each one takes away."
figures = [
  "timeline.bands[0].min_cn0_dbhz",
  "timeline.bands[1].min_cn0_dbhz",
  "timeline.bands[2].min_cn0_dbhz",
  "timeline.bands[3].min_cn0_dbhz",
  "timeline.bands[4].min_cn0_dbhz",
  "timeline.bands[0].tracking_fraction",
  "timeline.bands[1].tracking_fraction",
  "timeline.bands[2].tracking_fraction",
  "timeline.bands[3].tracking_fraction",
  "timeline.bands[4].tracking_fraction",
  "timeline.bands[0].worst_js_db",
  "timeline.bands[1].worst_js_db",
]

[[scenario.chart]]
title = "Lowest carrier-to-noise density of each band"
x = "timeline.bands[].name"
y = ["timeline.bands[].min_cn0_dbhz"]

[[scenario.chart]]
title = "Carrier-to-noise density over time: GPS L1 C/A, Galileo E1, GPS L2C, GPS L5"
x = "timeline.t_s"
y = [
  "timeline.bands[0].cn0_effective_dbhz",
  "timeline.bands[1].cn0_effective_dbhz",
  "timeline.bands[2].cn0_effective_dbhz",
  "timeline.bands[3].cn0_effective_dbhz",
]

[[scenario]]
id = "RUN-CAMPAIGN"
path = "campaign-jam-spoof-holdover-integrity.toml"
description = "A chained mission on one timeline: nominal, jamming, spoofing, holdover, integrity alarm, recovery."

[[scenario.chart]]
title = "Clock time error against its guard"
x = "timeline.t_s"
y = ["timeline.channels.time_error_ns.values", "timeline.channels.guard_ns.values"]

[[scenario.chart]]
title = "Carrier-to-noise density against the tracking floor"
x = "timeline.t_s"
y = ["timeline.channels.cn0_dbhz.values", "timeline.channels.cn0_floor_dbhz.values"]

[[scenario]]
id = "RUN-MARS"
path = "mars-orbit-pnt.toml"
description = "A 300 km Mars orbiter positioned by twelve navigation satellites and a two-way range from Earth, over one sol."
figures = [
  "fom.rms_error_relays_m",
  "fom.rms_error_with_earth_m",
  "fom.availability_relays",
  "fom.availability_with_earth",
  "fom.earth_visibility",
  "fom.median_pdop",
  "fom.mean_relays_visible",
  "earth_to_body.one_way_light_time_s",
  "earth_to_body.sun_separation_deg",
]

[[scenario.chart]]
title = "Position error of the seeded fix, with and without the Earth range"
x = "epochs[].t_s"
y = ["epochs[].error_relays_m", "epochs[].error_with_earth_m"]

# A Kshana Pro trade study (needs the Pro tier): two lunar relay designs, ranked.
[trade]
path = "trade-lunar-relay.toml"
description = "Lunar relay trade: the south-biased 14-satellite design of RUN-LUNAR against a 22-satellite design with a second, north-lingering elliptical shell."

