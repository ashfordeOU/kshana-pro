# Design study over a kind that is not a constellation: a one-way link budget.
#
# Question: how much transmit power does each data rate cost? The variables are the
# equivalent isotropic radiated power (EIRP) and the data rate; the objectives are the link
# margin (higher is better) and the EIRP (lower is better). The link equation is closed
# form, so the front is known in advance: the margin rises 1 dB for each dB of EIRP and
# falls 10*log10 of the data-rate ratio, so the front is the lowest data rate at each EIRP.
# tests/design_optimise.rs holds the study to that.
#
# The base scenario is the open engine's bundled link-budget.toml with its comments
# removed (see PROVENANCE.md).
#
# Run:  kshana-pro design scenarios/pro-power/design/link-budget-trade.toml --out out/

kind = "pro-design-optimise"
title = "X-band link: margin against transmit power"
seed = 1

base_scenario = """
kind = "link-budget"
band = "x"
eirp_dbw = 55.0
g_over_t_db = 53.0
range_km = 2000.0
data_rate_bps = 1.0e6
other_losses_db = 3.0
required_eb_n0_db = 4.5
"""

[[variable]]
name = "eirp_dbw"
key = "eirp_dbw"
type = "real"
min = 40.0
max = 60.0
step = 5.0

[[variable]]
name = "data_rate_bps"
key = "data_rate_bps"
type = "choice"
values = [1.0e5, 1.0e6, 1.0e7]

[[objective]]
name = "margin_db"
sense = "max"
path = "margin_db"

[[objective]]
name = "eirp_dbw"
sense = "min"
variable = "eirp_dbw"

[search]
method = "exhaustive"
budget = 100

[reference]
label = "Bundled link budget (55 dBW, 1 Mbit/s)"
values = { eirp_dbw = 55.0, data_rate_bps = 1.0e6 }
