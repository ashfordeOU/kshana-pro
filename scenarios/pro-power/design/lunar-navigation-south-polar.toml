# Design study: a lunar navigation constellation, scored over the south polar cap.
#
# Question: for a single Walker shell around the Moon, which designs give the highest
# share of time and surface with a usable position fix for the fewest satellites?
#
# The design space is 608 feasible single-shell Walker designs: 6 satellite counts, the
# plane counts that divide them, 2 phasings, 4 altitudes and 4 inclinations. Each design is
# one run of the open `constellation-design` kind. The run conditions (one day, 1 800 s
# steps, 10 deg elevation mask, PDOP at or below 6, 10 deg grid, one shared receiver clock)
# are those of the open engine's bundled lunar-relay-constellation scenario, which is also
# the reference design placed against the front.
#
# Region: the south polar cap only (latitude -90 to -70 deg, on a 5 deg grid). The design
# space, the run conditions and the reference design are those of
# lunar-navigation-global.toml; only the scored region and the grid spacing differ. The
# reference is the bundled design with three lines changed to score it over the same
# region (lat_min_deg and lat_max_deg added, grid_step_deg 10 -> 5); see PROVENANCE.md.
#
# MODELLED: two-body orbits around a spherical Moon (no Earth third-body perturbation),
# geometry only. See docs/DESIGN-OPTIMISER.md.
#
# Run:  kshana-pro design scenarios/pro-power/design/lunar-navigation-south-polar.toml --out out/

kind = "pro-design-optimise"
title = "Lunar navigation constellation: fewest satellites against availability, south polar cap"
seed = 1

base_scenario = """
kind = "constellation-design"
body = "moon"
duration_s = 86400.0
step_s = 1800.0
mask_deg = 10.0
pdop_threshold = 6.0
grid_step_deg = 5.0
lat_min_deg = -90.0
lat_max_deg = -70.0
clock = "common"
track_points = 49
max_tracks = 24

[[constellation]]
name = "Lunar navigation shell"

[[constellation.shell]]
pattern = "delta"
total = 8
planes = 2
phasing = 0
altitude_km = 1500.0
inclination_deg = 45.0
"""

[[variable]]
name = "total"
key = "constellation[0].shell[0].total"
type = "choice"
values = [8, 12, 14, 16, 20, 24]
unit = "count"

[[variable]]
name = "planes"
key = "constellation[0].shell[0].planes"
type = "choice"
values = [2, 3, 4, 6, 7, 8]
unit = "count"

[[variable]]
name = "phasing"
key = "constellation[0].shell[0].phasing"
type = "integer"
min = 0
max = 1
unit = "count"

[[variable]]
name = "altitude_km"
key = "constellation[0].shell[0].altitude_km"
type = "choice"
values = [1500.0, 3000.0, 5000.0, 8000.0]
unit = "km"

[[variable]]
name = "inclination_deg"
key = "constellation[0].shell[0].inclination_deg"
type = "real"
min = 45.0
max = 90.0
step = 15.0
unit = "deg"

[[constraint]]
walker = { total = "total", planes = "planes", phasing = "phasing" }

[[objective]]
name = "satellites"
sense = "min"
path = "total_satellites"

[[objective]]
name = "availability_pct"
sense = "max"
path = "global.availability_pct"

[search]
method = "auto"
budget = 1000

[reference]
label = "Bundled lunar relay design (8 + 6 satellites)"
scenario = '''
# A lunar relay and navigation constellation: satellites in elliptical lunar frozen orbits
# (ELFO) plus a circular low-lunar-orbit shell, scored as a coverage and dilution-of-precision
# (DOP) map over the whole Moon for one day.
#
# The central body is the Moon: gravitational parameter, 1 737.4 km radius and spin rate come
# from the body module (the DE and IAU values cited there). The design is illustrative, not
# any agency's:
#   - an ELFO shell: 8 satellites as a Walker 8/4/1 with perilune about 720 km and apolune
#     about 7 500 km (semi-major axis 5 847.4 km, eccentricity 0.58), 57.8 deg inclination
#     and argument of perilune 90 deg, so every satellite lingers at apolune over the south
#     polar region;
#   - a circular shell: 6 satellites as a Walker 6/3/1 at 1 500 km and 85 deg.
#
# One receiver clock is shared (clock = "common"): the relay set is one system on one time
# scale. Latitude is lunar body-fixed; the map is an equirectangular projection with no land
# outline.
#
# What the run answers: where on the Moon four or more of these satellites are in view above
# a 10 deg mask, the PDOP/HDOP/VDOP/GDOP per 10 deg cell, and the share of the day with PDOP
# at or below 6. MODELLED: two-body orbits around a spherical Moon (no Earth third-body
# perturbation, which a real frozen-orbit design depends on), geometry only.

kind = "constellation-design"
body = "moon"
duration_s = 86400.0
step_s = 1800.0
mask_deg = 10.0
pdop_threshold = 6.0
grid_step_deg = 5.0
lat_min_deg = -90.0
lat_max_deg = -70.0
clock = "common"
track_points = 49
max_tracks = 14

[[constellation]]
name = "Lunar relay"

[[constellation.shell]]
pattern = "delta"
total = 8
planes = 4
phasing = 1
semi_major_axis_km = 5847.4
eccentricity = 0.58
inclination_deg = 57.8
argp_deg = 90.0

[[constellation.shell]]
pattern = "delta"
total = 6
planes = 3
phasing = 1
altitude_km = 1500.0
inclination_deg = 85.0
'''
