# Kshana Pro uncertainty and sensitivity study (kind pro-uncertainty). Guide: docs/UNCERTAINTY.md.
#
# The same clock holdover, now with the clock's noise level itself uncertain.
#
# The open scenario fixes the white-frequency-noise intensity of the chip-scale atomic
# clock at the datasheet value q_wf = 9e-20 s^2/s. A programme rarely knows it that well:
# here it is uniform from half to three times that value, and the engine seed varies too
# (realisation k runs with seed 42 + k). The final time error is then a mixture of
# zero-mean normals whose variance is q_wf * 3010 s, so its variance is
# mean(q_wf) * 3010 s = 1.575e-19 * 3010 s and its standard deviation 21.77 ns, against
# 16.46 ns for the fixed datasheet value. tests/uncertainty.rs derives that value and
# holds the study to it.
#
# Run (2000 runs):
#   kshana-pro uncertainty scenarios/pro-power/uncertainty/uq-clock-holdover-qwf.toml --out out/uq-clock-qwf --license <token>
kind = "pro-uncertainty"
title = "Clock holdover with an uncertain noise level"
seed = 20260930

base_scenario = """
seed = 42
threshold_ns = 20.0
[time]
step_s = 10.0
duration_s = 3600.0
[gnss]
windows = [
  { t0 = 0.0, t1 = 600.0, state = "nominal" },
  { t0 = 600.0, t1 = 3600.0, state = "denied" },
]
[clock_quantum]
id = "optical-sr-lattice"
provenance = "Strontium optical lattice clock, space-oriented goal sigma_y(1s)=1e-15 (arXiv:1503.08457); not flown."
y0 = 5.0e-17
q_wf = 1.0e-30
q_rw = 0.0
[clock_classical]
id = "csac-sa45s"
provenance = "Microchip SA65 / SA.45s CSAC datasheet sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2."
y0 = 5.0e-10
q_wf = 9.0e-20
q_rw = 0.0
"""

[[input]]
name = "q_wf"
key = "clock_classical.q_wf"
unit = "s^2/s"
dist = "uniform"
min = 4.5e-20
max = 2.7e-19
source = "assumed: half to three times the datasheet value 9e-20 (Microchip SA.45s, sigma_y(1 s) = 3e-10); the unit-to-unit and ageing spread is not published"

[[output]]
name = "final_error"
path = "classical.series[-1].error_ns"
limit = { op = "abs_le", value = 20.0 }

[[output]]
name = "timing_rms"
path = "classical.fom.timing_rms_ns"

[[output]]
name = "time_error"
series = "classical.series[].error_ns"
time = "classical.series[].t"
limit = { op = "abs_le", value = 20.0 }

[sampling]
method = "lhs"
n = 2000
vary_seed = true

[sensitivity]
method = "src"
