# Kshana Pro Pack A — Optimism-Gap Audit (ID/OOD SWEEP — fast preview).
#
# A smaller, faster variant of the published baseline for a quick ID-vs-OOD sweep /
# preview: fewer cases, a wider severity ladder, fewer seeds. It exercises the SAME
# open kshana optimism-gap engine and reports the same field-vs-bench headline; it is
# NOT the published baseline (use optimism-gap-baseline.toml to reproduce the paper).
#
# HONEST SCOPE: MODELLED operating characteristics over a SYNTHETIC,
# parameter-grounded corpus (never field/IQ). The optimism gap is a controlled
# synthetic→synthetic severity shift — an engineering study, NOT a certification.
# Proof: arXiv:2606.22054, an arXiv PREPRINT (not peer-reviewed).
#
# Run (Pro tier):  kshana-pro run scenarios/optimism-gap-sweep.toml --dev
kind = "pro-optimism-gap-audit"

n_per_class = 150              # smaller corpus → faster preview
frac_train = 0.7
severities = [0.2, 0.4, 0.6, 0.8, 0.9]  # a wider OOD severity ladder
seeds = [1, 2, 3]             # fewer seeds for speed (wider per-cell spread)
target_pfa = 0.05

ridge_lambda = 0.1
n_perms = 200
perm_seed = 7
