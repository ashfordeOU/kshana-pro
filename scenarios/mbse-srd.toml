# Kshana Pro L3 assurance (PR16) — ECSS/MBSE artifacts from a requirements set.
#
# Produces a margins table (target vs achieved, PASS/FAIL), a traceability CSV, and
# a ReqIF-lite XML export (DOORS / Polarion importable).
#
# Run:  kshana-pro run scenarios/mbse-srd.toml --dev   (Enterprise tier)
kind = "pro-mbse"
title = "Quantum-PNT demonstrator — SRD compliance margins"

[[requirement]]
id = "SYS-001"
text = "Payload mass shall not exceed 12 kg"
verification = "Analysis"
target = 12.0
achieved = 10.5
lower_is_better = true

[[requirement]]
id = "SYS-002"
text = "Timing availability shall be >= 0.99"
verification = "Test"
target = 0.99
achieved = 0.995
lower_is_better = false

[[requirement]]
id = "SYS-003"
text = "Holdover timing error shall be <= 30 ns (24 h, GNSS-denied)"
verification = "Analysis"
target = 30.0
achieved = 23.6
lower_is_better = true
