# Kshana Pro L3 demonstrator — automated architecture trade study + assurance pack.
#
# Run two clock architectures (optical-lattice vs CSAC) through the embedded open
# engine, rank them by timing holdover, and emit an audit-grade evidence pack with
# reproducible scenario hashes. Each `variant.scenario` is a full open Kshana
# scenario, run unchanged.
#
# Run:  kshana-pro run scenarios/trade-clock.toml
kind = "pro-trade-study"
title = "Quantum vs classical clock — timing holdover trade"
metric = "quantum.fom.holdover_s"   # dot-path into each variant's result JSON
lower_better = false                 # longer holdover is better

[[variant]]
label = "optical-lattice"
scenario = """
kind = "clock"
seed = 42
threshold_ns = 20.0
[time]
step_s = 10.0
duration_s = 7200.0
[gnss]
windows = [
  { t0 = 0.0,   t1 = 600.0,  state = "nominal" },
  { t0 = 600.0, t1 = 7200.0, state = "denied" },
]
[clock_quantum]
id = "optical-sr-lattice"
provenance = "Sr optical lattice, goal sigma_y(1s)=1e-15; q_wf=sigma_y(1s)^2"
y0 = 0.0
q_wf = 1.0e-30
q_rw = 0.0
[clock_classical]
id = "csac-sa45s"
provenance = "CSAC sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2"
y0 = 0.0
q_wf = 9.0e-20
q_rw = 0.0
"""

[[variant]]
label = "csac-only"
scenario = """
kind = "clock"
seed = 42
threshold_ns = 20.0
[time]
step_s = 10.0
duration_s = 7200.0
[gnss]
windows = [
  { t0 = 0.0,   t1 = 600.0,  state = "nominal" },
  { t0 = 600.0, t1 = 7200.0, state = "denied" },
]
[clock_quantum]
id = "csac-sa45s"
provenance = "CSAC sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2"
y0 = 0.0
q_wf = 9.0e-20
q_rw = 0.0
[clock_classical]
id = "csac-sa45s"
provenance = "CSAC sigma_y(1s)=3e-10; q_wf=sigma_y(1s)^2"
y0 = 0.0
q_wf = 9.0e-20
q_rw = 0.0
"""
