# Custom runner labels actionlint cannot know about.
#
# Historical: until 20 Nov 2026 this repository was private and its CI ran on a self-hosted
# runner (hosted minutes were billing-blocked). Workflows now use GitHub-hosted runners; the
# `kshana-pro` label is kept here only so old references still lint.
self-hosted-runner:
  labels:
    - kshana-pro
