name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    # GitHub-hosted (the repository is public, 20 Nov 2026; hosted minutes are free for public
    # repositories). Three jobs in parallel: lint and guards, the test suite, the release checks.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in rust-toolchain.toml (== the open core's) for a
      # reproducible build of the overlay and the kshana engine it embeds.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The formatter is a hard gate: the crate must stay `cargo fmt --all` clean.
      - name: Format
        run: cargo fmt --all -- --check
      # Roadmap 0.42 X3: the Arksa-exclusive code moved to a private server-side crate that
      # depends on this one. No [arksa] or [core] term of protect/private-terms.txt and no
      # name of that crate may appear in this repository's source, manifests or lockfiles
      # (printed by term ID only).
      - name: Arksa source guard (X3)
        run: scripts/protect/source-guard.sh
      # Roadmap 0.42 X8: "In Arksa" claims in this repository's marketing and docs name only
      # the four allowed outcomes (owner, 15 November 2026), with no private term near them.
      - name: X8 "In Arksa" copy check
        run: python3 scripts/protect/arksa-copy-check.py --scope kpro
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The default feature set is what release builds use: it must compile and lint clean
      # WITHOUT the patent-candidate methods (feature `unfiled-methods`). The step above proves it.
      - name: Clippy (with unfiled-methods, so the gated code is linted)
        run: cargo clippy --all-targets --features unfiled-methods -- -D warnings
      # Key custody S7-a: the AWS KMS signer, built and tested against a fake KMS endpoint.
      - name: KMS signer (S7-a)
        run: |
          cargo clippy --all-targets --features kms -- -D warnings
          cargo test --locked --features kms --test licence_kms --lib license::
      # Roadmap S4 and C9: the editions page and the private price sheet are current, and no
      # public tree carries a private price.
      - name: Price list (S4, C9)
        run: |
          python3 commercial/tools/prices.py build --check
          python3 commercial/tools/prices.py scan-public site-next commercial/editions

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in rust-toolchain.toml (== the open core's) for a
      # reproducible build of the overlay and the kshana engine it embeds.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # With 120+ integration-test binaries the debug build outgrew the hosted runner's free
      # disk (offline_bundle failed with "No space left on device", 21 Nov 2026). Remove
      # preinstalled toolchains this job never uses, and build the tests without debug info.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Cargo.lock pins the exact kshana (public open-core) rev, so the git
      # dependency resolves reproducibly. --locked fails the build if the lockfile
      # is out of date rather than silently updating it.
      - name: Test
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --all --locked --features unfiled-methods

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in rust-toolchain.toml (== the open core's) for a
      # reproducible build of the overlay and the kshana engine it embeds.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # PRO-14: a release build and a signed licence token, which the debug tests above never
      # exercise. Builds with a CI-only key, issues a Pro token, runs one Pro pack with the
      # debug and the release binary and requires identical reports (scripts/release-smoke.sh).
      - name: Release smoke
        run: scripts/release-smoke.sh
      # D-K11 layer guard: Kshana Core never ships, so no manifest, lockfile, vendored path or
      # built binary of this crate may name it (scripts/core-guard.sh).
      - name: Core guard
        run: scripts/core-guard.sh
      # Roadmap 0.42 X4: the release binary (built by the release smoke above) carries no
      # Arksa-exclusive or Core name and is stripped. The terms are in
      # protect/private-terms.txt; a match is printed by term ID only.
      - name: Arksa and Core symbol check (X4)
        run: scripts/protect/symbol-check.sh --require-stripped target/release/kshana-pro
