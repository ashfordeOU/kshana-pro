name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Self-hosted, not ubuntu-latest. GitHub-hosted Actions minutes on this account are
    # billing-blocked: a hosted job never starts at all — steps: [], failure in ~3s, with
    # the annotation "recent account payments have failed". Every push here failed that way
    # from 2026-09-18 onward, which is a billing state and not a defect in this crate.
    # Self-hosted runners schedule normally under that block; it was proven on the
    # ci/runner-probe branch with a hosted control job dispatched in the same second.
    # Runner: macmini-kshana-pro (macOS arm64). Label declared in .github/actionlint.yaml.
    # When a payment method is restored this is a one-line revert to ubuntu-latest.
    runs-on: [self-hosted, macos, arm64, kshana-pro]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in rust-toolchain.toml (== the open core's) for a
      # reproducible build of the overlay and the kshana engine it embeds.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The formatter is a hard gate: the crate must stay `cargo fmt --all` clean.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The Arksa-exclusive kinds (roadmap 0.42, section 1a) compile only with the `arksa`
      # feature; lint and test that build too (docs/PROTECTION.md).
      - name: Clippy (arksa feature)
        run: cargo clippy --all-targets --features arksa -- -D warnings
      # Cargo.lock pins the exact kshana (public open-core) rev, so the git
      # dependency resolves reproducibly. --locked fails the build if the lockfile
      # is out of date rather than silently updating it.
      - name: Test
        run: cargo test --all --locked
      - name: Test (arksa feature)
        run: cargo test --all --locked --features arksa
      # PRO-14: a release build and a signed licence token, which the debug tests above never
      # exercise. Builds with a CI-only key, issues a Pro token, runs one Pro pack with the
      # debug and the release binary and requires identical reports (scripts/release-smoke.sh).
      - name: Release smoke
        run: scripts/release-smoke.sh
      # D-K11 layer guard: Kshana Core never ships, so no manifest, lockfile, vendored path or
      # built binary of this crate may name it (scripts/core-guard.sh).
      - name: Core guard
        run: scripts/core-guard.sh
      # Roadmap 0.42 X4: the default release binary (built by the release smoke above, no
      # `arksa` feature) carries no Arksa-exclusive or Core name and is stripped. The terms are
      # in protect/private-terms.txt; a match is printed by term ID only.
      - name: Arksa and Core symbol check (X4)
        run: scripts/protect/symbol-check.sh --require-stripped target/release/kshana-pro
