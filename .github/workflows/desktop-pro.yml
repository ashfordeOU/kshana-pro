name: Desktop Pro
# Kshana Desktop Pro (apps/desktop-pro): the Pro home tests (node), format, clippy and the bridge
# and licence tests.
# The frontend is staged from the open repository when it carries the Desktop client;
# otherwise a placeholder page, which is enough to compile and test the native side.
on:
  push:
    branches: [main]
    paths: ["apps/desktop-pro/**", "src/**", "Cargo.toml", "commercial/payments.toml", "commercial/tier-manifest.json*", "protect/**", "scripts/protect/**", ".github/workflows/desktop-pro.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-pro:
    runs-on: [self-hosted, macos, arm64, kshana-pro]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Stage the frontend
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ashfordeOU/kshana open-repo || true
          if [ -f open-repo/web/studio/lib/desktop.mjs ]; then
            apps/desktop-pro/build-frontend.sh "$PWD/open-repo"
          else
            echo "the open repository has no Desktop client yet: placeholder frontend"
            mkdir -p apps/desktop-pro/dist && cp -r apps/desktop-pro/pro apps/desktop-pro/dist/pro
            echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=pro/home.html"><title>Kshana Desktop Pro</title>' > apps/desktop-pro/dist/index.html
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pro home and licence screen (node tests)
        run: node --test apps/desktop-pro/pro/desktop/*.test.mjs
      - name: Format
        run: cargo fmt --manifest-path apps/desktop-pro/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop-pro/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/desktop-pro/src-tauri/Cargo.toml
      # Roadmap 0.42 X4: Desktop Pro ships to customer devices, so its release build must carry
      # no Arksa-exclusive or Core name (the overlay is linked with default features only) and
      # must be stripped. A match is printed by term ID only (protect/private-terms.txt).
      - name: Release build and Arksa/Core symbol check (X4)
        run: |
          set -euo pipefail
          cargo build --release --manifest-path apps/desktop-pro/src-tauri/Cargo.toml
          scripts/protect/symbol-check.sh --require-stripped apps/desktop-pro/src-tauri/target/release/kshana-pro-desktop
