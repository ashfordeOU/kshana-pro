# Signed and notarised Kshana Desktop Pro for macOS (private).
#
# Run by hand (Actions -> Desktop Pro release (macOS) -> Run workflow). It builds apps/desktop-pro with the
# Studio frontend from the open repository at the given tag, as one universal app (Apple silicon and Intel),
# signs it with the Developer ID Application identity and the hardened runtime, notarises and staples the app
# and the disk image, checks both with codesign, spctl and stapler, and keeps the .dmg and its SHA-256 in a private draft release
# of this repository and in ~/kshana-releases/desktop-pro on the runner Mac. Nothing is published. It runs on the owner's self-hosted Mac
# (hosted macOS is not available to this private repository); the user keychain search list is saved and
# restored, and the temporary keychain is deleted at the end. Secret values are never printed.
name: Desktop Pro release (macOS)
on:
  workflow_dispatch:
    inputs:
      open_tag:
        description: "Open-repository tag whose Studio frontend is bundled, e.g. v0.41.0"
        required: true
        default: v0.41.0
        type: string
      frontend_ref:
        description: "Optional open-repository branch or tag to take the Studio frontend from instead (test builds, e.g. main). Leave empty for a release."
        required: false
        default: ""
        type: string
permissions:
  contents: write # a private draft release holds the signed disk image
concurrency:
  group: desktop-pro-release
  cancel-in-progress: false
jobs:
  macos:
    name: sign, notarise, keep
    runs-on: [self-hosted, macos, arm64, kshana-pro]
    timeout-minutes: 120
    env:
      OPEN_TAG: ${{ inputs.open_tag }}
      FRONTEND_REF: ${{ inputs.frontend_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: The app's engine pin matches the open tag
        run: |
          set -euo pipefail
          printf '%s' "$OPEN_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$OPEN_TAG' is not vX.Y.Z"; exit 1; }
          pin="$(grep -E '^kshana = "=' apps/desktop-pro/src-tauri/Cargo.toml | sed -E 's/.*"=([^"]+)".*/\1/')"
          [ "v$pin" = "$OPEN_TAG" ] || { echo "::error::Desktop Pro pins kshana $pin, the open tag is $OPEN_TAG"; exit 1; }
          echo "VERSION=$(python3 -c 'import json;print(json.load(open("apps/desktop-pro/src-tauri/tauri.conf.json"))["version"])')" >> "$GITHUB_ENV"
      - name: Stage the frontend from the open repository at the tag (or the test ref)
        run: |
          set -euo pipefail
          REF="${FRONTEND_REF:-$OPEN_TAG}"
          printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "::error::'$REF' is not a branch or tag name"; exit 1; }
          rm -rf open-repo
          git clone --depth 1 --branch "$REF" https://github.com/ashfordeOU/kshana open-repo
          SUFFIX=""
          if [ -n "$FRONTEND_REF" ]; then SUFFIX="-ui-$(git -C open-repo rev-parse --short=9 HEAD)"; fi
          echo "frontend: kshana $REF at $(git -C open-repo rev-parse HEAD)"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          apps/desktop-pro/build-frontend.sh "$PWD/open-repo"
      - name: Import the Developer ID Application identity into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is missing"; exit 1; }
          done
          W="$RUNNER_TEMP/sign"; rm -rf "$W"; mkdir -p "$W"
          KC="$W/release.keychain-db"; KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"; echo "W=$W" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$W/app.p12"
          security import "$W/app.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$W/app.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user | tr -d '"' | xargs > "$W/orig-keychains.txt"
          security list-keychains -d user -s "$KC" $(cat "$W/orig-keychains.txt")
          ID="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$ID" ] || { echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          printf '%s' "$ID" | grep -q "($APPLE_TEAM_ID)" || { echo "::error::the identity is not issued to APPLE_TEAM_ID"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "ok  signing identity imported (Team ID matches)"
      - name: Build, sign and notarise (universal)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cargo tauri --version 2>/dev/null || cargo install tauri-cli --version "^2" --locked
          cd apps/desktop-pro/src-tauri
          cargo tauri build --target universal-apple-darwin --bundles app,dmg
      # Roadmap 0.42 X4: before the disk image is signed and kept, the whole app bundle (binary
      # and resources) must carry no Arksa-exclusive or Core name, and the binary must be
      # stripped. A match is printed by term ID only (protect/private-terms.txt).
      - name: Arksa and Core symbol check on the app bundle (X4)
        run: |
          set -euo pipefail
          B=apps/desktop-pro/src-tauri/target/universal-apple-darwin/release/bundle
          APP="$(ls -d "$B"/macos/*.app | head -1)"
          scripts/protect/symbol-check.sh --require-stripped "$APP"
      - name: Check the app; sign, notarise and staple the disk image; check it
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          B=apps/desktop-pro/src-tauri/target/universal-apple-darwin/release/bundle
          APP="$(ls -d "$B"/macos/*.app | head -1)"
          DMG="$(ls "$B"/dmg/*.dmg | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "^(Authority=Developer ID Application|TeamIdentifier|Runtime Version|Timestamp)"
          codesign -dv "$APP" 2>&1 | grep -q "flags=0x10000(runtime)" || { echo "::error::hardened runtime is not on"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64" || { echo "::error::not universal"; exit 1; }
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 45m \
            | tee "$W/notary.txt" | grep -E "status:|id:" | head -4
          grep -q "status: Accepted" "$W/notary.txt" || { echo "::error::the notary service did not accept the disk image"; exit 1; }
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          OUT="$RUNNER_TEMP/out"; rm -rf "$OUT"; mkdir -p "$OUT"
          NAME="Kshana-Desktop-Pro-${VERSION}-engine-${OPEN_TAG#v}${SUFFIX}-macos-universal.dmg"
          cp "$DMG" "$OUT/$NAME"
          (cd "$OUT" && shasum -a 256 "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Keep the signed disk image (private draft release, and a copy on this Mac)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Actions artifact storage is not used (this private repository's quota is full); release assets are not
          # Actions storage. A draft release is visible only to people with access to this private repository.
          KEEP="$HOME/kshana-releases/desktop-pro"; mkdir -p "$KEEP"; cp "$OUT"/* "$KEEP"/
          echo "copy on this Mac: $KEEP"
          TAG="desktop-pro-${VERSION}-engine-${OPEN_TAG#v}${SUFFIX}"
          if command -v gh >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
                   --title "Kshana Desktop Pro ${VERSION} (engine ${OPEN_TAG}${SUFFIX}), macOS, signed and notarised" \
                   --notes "Private draft. Built by the Desktop Pro release workflow, run ${GITHUB_RUN_ID}."
            gh release upload "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "draft release: $TAG"
          else
            echo "::warning::gh is not installed on this runner; the signed disk image is only in $KEEP"
          fi
      - name: Clean up
        if: always()
        run: |
          if [ -n "${W:-}" ] && [ -s "$W/orig-keychains.txt" ]; then security list-keychains -d user -s $(cat "$W/orig-keychains.txt"); fi
          [ -n "${KC:-}" ] && security delete-keychain "$KC" 2>/dev/null || true
          [ -n "${W:-}" ] && rm -rf "$W" || true
          rm -rf open-repo
