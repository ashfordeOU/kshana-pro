name: eLoran engine
# The proprietary eLoran/GNSS simulator crate (crates/kshana-eloran): format, strict lint and
# the full test suite on every push and pull request, and a nightly hardware-in-the-loop
# style run on the virtual bench (A3) plus the software acceptance tests (A5).
#
# GitHub-hosted (public repository). To run
# the nightly job against real LF hardware, give a lab runner the extra label
# `eloran-hil` and set the repository variable ELORAN_HIL=1: the job then also runs the
# `--features soapy` build and the bench acceptance command with the lab's device and
# instrument profiles (paths in the ELORAN_HIL_* variables).
on:
  push:
    branches: [main, "eloran/**"]
    paths: ["crates/kshana-eloran/**", "sdk/python/**", ".github/workflows/eloran.yml"]
  pull_request:
    paths: ["crates/kshana-eloran/**", "sdk/python/**", ".github/workflows/eloran.yml"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: crates/kshana-eloran
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kshana-eloran
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (hardware drivers, compile only)
        run: cargo clippy --all-targets --features soapy,uhd,redpitaya,digilent -- -D warnings
      - name: Tests
        run: cargo test --locked --features unfiled-methods
  nightly-bench:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kshana-eloran
      - name: Virtual bench and acceptance (release)
        run: "cargo test --release --locked --features unfiled-methods -- hw::virtual accept:: calreg sync::measure"
      - name: Conformance and campaign runner (release)
        run: "cargo test --release --locked -- campaign::"
      - name: Python SDK (unit and integration against a fresh kshana-pro build)
        working-directory: .
        run: |
          cargo build --locked --bin kshana-pro
          KSHANA_PRO_BIN="$PWD/target/debug/kshana-pro" python3 -m unittest discover -s sdk/python/tests -v
