# E3b held-out campaign for the receiver resilience scorecard (roadmap 0.42, E3b).
# Pre-registration: docs/evidence/e3-receiver-scorecard/2026-11-16_E3b_PREREGISTRATION.md (approved by
# the owner, 16 Nov 2026). Committed before its first scoring. SYNTHETIC: every case is a MODELLED
# analogue generated by the open engine (AGPL-3.0); the unit under test is the open engine's
# synthetic NMEA receiver model, not a product. New generator seeds 31001 to 31016.
#
#   scored once with method kshana-pro/receiver-scorecard/v2
kind = "pro-receiver-scorecard"
title = "E3b held-out: threat library analogues on new seeds, open-engine NMEA receiver model"
method = "kshana-pro/receiver-scorecard/v2"

[receiver]
