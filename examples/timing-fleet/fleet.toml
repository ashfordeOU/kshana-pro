# Demo timing fleet (roadmap 0.42 T2), recorded data. Two clocks are REAL public data (IGS GPS
# satellite rubidium clocks standing in for site references); every other log is SYNTHETIC
# (examples/timing-fleet/generate.py). Vendors and models are placeholders.
#
#   kshana-pro timing assess  examples/timing-fleet/fleet.toml --evidence <dir>
#   kshana-pro timing console examples/timing-fleet/fleet.toml --evidence <dir> --out fleet.html
#   kshana-pro timing metrics examples/timing-fleet/fleet.toml
kind = "pro-timing-holdover"
title = "Demo timing fleet"
fleet = "demo-ldn-fra"
window_h = 48
horizon_h = 48

# Limits are values the operator sets; the names say which style they follow, nothing more.
[[limits]]
name = "RTS 25 HFT style (user-set)"
value_s = 100e-6

[[limits]]
name = "PRTC-A style (user-set)"
value_s = 1.1e-6

[[limits]]
name = "Internal 100 ns (user-set)"
value_s = 100e-9

[[clocks]]
id = "gm-fra-1"
site = "FRA"
vendor = "IGS public data"
model = "GPS G03 (rubidium)"
role = "reference (real data)"
[clocks.source]
format = "timelab"
path = "logs/gm-fra-1.timelab"

[[clocks]]
id = "ref-fra-0"
site = "FRA"
vendor = "IGS public data"
model = "GPS G25 (rubidium)"
role = "reference (real data)"
[clocks.source]
format = "timelab"
path = "logs/ref-fra-0.timelab"

[[clocks]]
id = "gm-ldn-1"
site = "LDN"
vendor = "Vendor A"
model = "GM-R (rubidium)"
role = "grandmaster"
[clocks.source]
format = "ticc"
path = "logs/gm-ldn-1.ticc"
channel = "chA"

[[clocks]]
id = "bc-ldn-2"
site = "LDN"
vendor = "Vendor B"
model = "BC-O (OCXO)"
role = "boundary"
class = "ocxo"
[clocks.source]
format = "ptp4l"
path = "logs/bc-ldn-2.ptp4l.log"

[[clocks]]
id = "srv-ldn-3"
site = "LDN"
vendor = "Vendor C"
model = "Server (TCXO)"
role = "server"
class = "tcxo"
limits = ["RTS 25 HFT style (user-set)"]
[clocks.source]
format = "chrony-tracking"
path = "logs/srv-ldn-3.tracking.log"
tau0_s = 64.0
gaps = "linear"

[[clocks]]
id = "wr-fra-2"
site = "FRA"
vendor = "Vendor D"
model = "WR node (OCXO)"
role = "boundary"
class = "ocxo"
[clocks.source]
format = "wr-stat"
path = "logs/wr-fra-2.wrstat.log"

[[clocks]]
id = "ntp-fra-4"
site = "FRA"
vendor = "Vendor E"
model = "NTP client (TCXO)"
role = "client"
class = "tcxo"
limits = ["RTS 25 HFT style (user-set)"]
[clocks.source]
format = "ntp-loopstats"
path = "logs/ntp-fra-4.loopstats"

[[clocks]]
id = "pps-ldn-5"
site = "LDN"
vendor = "Vendor F"
model = "Host on PPS (TCXO)"
role = "server"
class = "tcxo"
[clocks.source]
format = "pps-assert"
path = "logs/pps-ldn-5.assert"
