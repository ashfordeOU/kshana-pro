# PROPRIETARY — Kshana Pro overlay. Not part of the open-source engine. See LICENSE.
#
# Kshana Desktop Pro: the open Kshana Desktop shell with the Pro overlay linked in and
# unlocked by the Desktop licence (roadmap F10e). A separate download: the free Desktop
# (the open repository's apps/desktop) carries no Pro code.
[package]
name = "kshana-pro-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
publish = false
license-file = "../../../LICENSE"

[lib]
name = "kshana_pro_desktop"
path = "src/lib.rs"

[[bin]]
name = "kshana-pro-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kshana-pro = { path = "../../.." }
kshana = "=0.41.0"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package.kshana]
opt-level = 3
