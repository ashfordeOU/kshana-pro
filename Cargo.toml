[package]
name = "kshana-pro"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"  # the open engine's floor since 0.28.0
description = "Kshana Pro — proprietary overlay on the open Kshana PNT-resilience engine"
authors = ["Chakshu Baweja <contact@ashforde.org>"]
license-file = "LICENSE"
# CLOSED OVERLAY — must never be published to a public registry. `publish = false`
# is a hard guard: `cargo publish` will refuse, so the proprietary code cannot be
# pushed to crates.io even by mistake.
publish = false

[lib]

[[bin]]
name = "kshana-pro"
path = "src/main.rs"

[features]
default = []

[dependencies]
# The open AGPL-3.0-only engine, consumed as a dependency — NEVER forked. Pro is a
# strict superset of open Kshana by construction: it embeds the whole engine and
# every open feature, then extends it through the public `ExternalPack` / model
# trait seams (see docs/OVERLAY-ARCHITECTURE.md).
#
# The overlay attaches through the open core's PackRegistry /
# ExternalPack::register_into seam, which is merged to kshana `main`. Tracked on
# main (Cargo.lock pins the exact rev for reproducibility); `cargo update -p kshana`
# advances it as each open-core phase lands. Flip to a version/tag pin once the open
# core cuts a release carrying the seam, e.g.
#     kshana = "0.24"
#   or
#     kshana = { git = "https://github.com/ashfordeOU/kshana", tag = "v0.24.0" }
# For local co-development, override with a path dep to a sibling checkout.
# The `version` field keeps the semver contract recorded; kept in lock-step with the
# open core's version.
# Pinned to the published crate, not a branch: the open core has now cut a release
# carrying the seam (v0.27.1), which is what the note above said to wait for. A
# registry version is reproducible for anyone who clones this repo; a branch pin
# resolved to whatever main happened to be, and when main's history was rewritten
# the recorded rev stopped existing and a fresh clone could not build at all.
# 0.28.0 adds the slot-timing kind and the commercial clock classes (TCXO, OCXO, RAFS).
kshana = "0.28"

# Versions kept in lock-step with the open core (kshana/Cargo.toml) so the two
# graphs share one resolved copy of each crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Needed to drive the open ErrorModel/ClockModel (its `step` takes an RngCore) when
# the L1 twin framework synthesises a series for Allan-deviation validation.
rand = "0.8"
rand_chacha = "0.3"
# Licensing: Ed25519-signed license tokens (PR7; HMAC-SHA256 until 2026-09-26).
# The vendor signs with a private key; a build verifies with the public key only.
# sha2/hex match the open core's versions.
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
hex = "0.4"
# Pure-Rust PDF export of the branded study report (src/report_pdf.rs). Default
# features off: we render from primitives (built-in standard-14 fonts, lines,
# rectangles, text) and need NONE of the heavy optional layers (html/svg/images/
# fontconfig/azul). No external TTF files are bundled. CreationDate/ModDate/the
# metadata date are pinned to the Unix epoch, so the PDF BODY is reproducible. The
# trailer /ID is NOT pinned — printpdf randomises it per build, so two runs of the
# same input differ in that one line. Committed PDFs are therefore byte-stable in
# content but not byte-identical as files; the CSV tables are the reproducibility
# anchor that the committed-artifact tests actually compare.
printpdf = { version = "0.9.1", default-features = false }
